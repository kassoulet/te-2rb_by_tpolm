<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TE-2RB - JS port</title>
<style>
:root{--bg:#0b0b10;--fg:#d8d8e0;--ac:#ff5d8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:18px;margin:14px 0 2px;letter-spacing:2px}small{opacity:.7}
#stage{position:relative;width:min(96vw,calc((100vh - 170px)*4/3));aspect-ratio:4/3;background:#000;border:1px solid #333;margin-top:8px}
#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;display:block}
#stage:fullscreen canvas{width:min(100vw,100vh*4/3);height:min(100vh,100vw*3/4)}
#go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:#fff;font-size:20px;cursor:pointer;text-align:center}
#bar{display:flex;gap:8px;align-items:center;width:min(96vw,900px);margin:10px 0}
button{background:#1d1d28;color:var(--fg);border:1px solid #444;border-radius:4px;padding:6px 12px;cursor:pointer}button:hover{border-color:var(--ac)}
input[type=range]{flex:1;accent-color:var(--ac)}#tm{font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
</style></head><body>
<h1>TE-2RB</h1><small>JavaScript port (640x480, 4:3)</small>
<div id="stage"><canvas id="c" width="640" height="480"></canvas><div id="go">Loading...</div></div>
<div id="bar"><button id="pp" title="Space">Play</button><button id="b10">-10s</button><input id="seek" type="range" min="0" max="3072" step="1" value="0"><button id="f10">+10s</button><span id="tm">0:00 / 5:07</span><button id="fs">Fullscreen</button></div>
<script type="module" src="js/player.js"></script></body></html>
